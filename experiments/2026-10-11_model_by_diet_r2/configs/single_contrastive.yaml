run_directory: data/runs/2026-10-11_model_by_diet_r2/single_contrastive
device: cuda
seed: 0
model:
  embedding_head: residual_mlp
  checkpoint: answerdotai/ModernBERT-base
  card_embedding_size: 256
  mlp_hidden_dim: 512
  mlp_num_blocks: 9
  pooling:
    kind: mean
  enrichment:
    kind: whitening
    stats_path: data/runs/2026-10-11_model_by_diet_r2/single_contrastive/whitening_stats.pt
dojos:
- contrastive.flesh_and_blood
- contrastive.slay_the_spire_2
- contrastive.mtg
- contrastive.pokemon
- contrastive.dominion
- contrastive_cross_slice.flesh_and_blood
- contrastive_cross_slice.slay_the_spire_2
- contrastive_cross_slice.mtg
- contrastive_cross_slice.pokemon
- contrastive_cross_slice.dominion
- contrastive_slice_match.flesh_and_blood
- contrastive_slice_match.slay_the_spire_2
- contrastive_slice_match.mtg
- contrastive_slice_match.pokemon
- contrastive_slice_match.dominion
- contrastive_missing_card.flesh_and_blood
- contrastive_missing_card.slay_the_spire_2
- contrastive_missing_card.mtg
- contrastive_missing_card.pokemon
- contrastive_missing_card.dominion
- contrastive_odd_one_out.flesh_and_blood
- contrastive_odd_one_out.slay_the_spire_2
- contrastive_odd_one_out.mtg
- contrastive_odd_one_out.pokemon
- contrastive_odd_one_out.dominion
- cross_game.rarity_tier
- cardvault_fabtcg.pitch_mask
- fabtcg_decklists.hero_masked_from_deck
- hearthstonejson.class_mask
- isotropic.kingdom_veto_prediction
- pokemon_tcg.hp_regression
- scryfall.cmc_regression
- seventeenlands_game_data.deck_win_prediction
- seventeenlands_replay_data.average_turn_cast
- spire_codex.card_type_mask
- sts2_runs.card_reward_pick
- sts2_runs.card_win_rate
- sts2_runs.card_win_rate_at_act2
held_out_dojos:
- cross_game.rarity_tier
- cardvault_fabtcg.pitch_mask
- fabtcg_decklists.hero_masked_from_deck
- hearthstonejson.class_mask
- isotropic.kingdom_veto_prediction
- pokemon_tcg.hp_regression
- scryfall.cmc_regression
- seventeenlands_game_data.deck_win_prediction
- seventeenlands_replay_data.average_turn_cast
- spire_codex.card_type_mask
- sts2_runs.card_reward_pick
- sts2_runs.card_win_rate
- sts2_runs.card_win_rate_at_act2
holdout:
  seed: 0
  tier_ratios:
  - 8
  - 1
  - 1
  held_out_games:
  - gwent
regression_loss: huber
hardware:
  max_batch_cost: 256
  precision: fp16
eval_examples_per_dojo: 128
phases:
- name: train
  diet:
    rule: table
    table:
    - weight: 1
      dojos:
      - contrastive.*
    - weight: 1
      dojos:
      - contrastive_cross_slice.*
    - weight: 1
      dojos:
      - contrastive_slice_match.*
    - weight: 1
      dojos:
      - contrastive_missing_card.*
    - weight: 1
      dojos:
      - contrastive_odd_one_out.*
  encoder_trainable: true
  encoder_lr: 0.0001
  head_lr: 0.001
  steps_per_round: 5000
  max_rounds: 4
  saturation:
    epsilon: 0.001
    patience_rounds: 1000
    reactivation_delta: 0.05
    target_saturated_fraction: 1.0
