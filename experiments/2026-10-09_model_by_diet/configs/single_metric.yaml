# Series 1, cell single_metric: Single-card model, metric dojos only.
# Shared settings and the held-out set: README.md in this directory.
# Run with (ROCm venv):
#   PYTHONPATH=. python scripts/run_training.py configs/training/Oct_9_2026/single_metric.yaml
# Check data, dojos and model without training: add --check

run_directory: data/runs/Oct_9_2026/single_metric
device: cuda
seed: 0

model:
  embedding_head: residual_mlp
  checkpoint: answerdotai/ModernBERT-base
  card_embedding_size: 256
  mlp_hidden_dim: 512
  # 9 blocks: 2,898,176 trainable parameters, matching the multi-card arm
  mlp_num_blocks: 9

# 124 trained dojos (held-out ones below join them). Entries are
# names or patterns (*, ?, [...]); a quoted "!pattern" drops what it
# matches from the names so far.
dojos:
  # metric, by source (held-out ones are dropped from training below)
  - cardvault_fabtcg.*
  - dominiontabs.*
  - fabtcg_decklists.*
  - final_decks.*
  - hearthstonejson.*
  - isotropic.*
  - pokemon_tcg.*
  - scryfall.*
  - seventeenlands_draft_data.*
  - seventeenlands_game_data.*
  - seventeenlands_replay_data.*
  - spire_codex.*
  - sts2_runs.*
  - sts_gg.*
  # Gwent is the held-out game (holdout.held_out_games): none of its dojos
  - "!*gwent*"

# Never trained; scored every round with untrained heads, and trained
# fresh on the frozen encoder by the extrinsic evaluation. The same set
# in every series-1 cell. Each joins the run's dojos (no need to list
# them above too).
held_out_dojos:
  - cross_game.rarity_tier
  - cardvault_fabtcg.pitch_mask
  - fabtcg_decklists.hero_masked_from_deck
  - hearthstonejson.class_mask
  - isotropic.kingdom_veto_prediction
  - pokemon_tcg.hp_regression
  - scryfall.cmc_regression
  - seventeenlands_game_data.deck_win_prediction
  - seventeenlands_replay_data.average_turn_cast
  - spire_codex.card_type_mask
  - sts2_runs.card_reward_pick
  - sts2_runs.card_win_rate
  - sts2_runs.card_win_rate_at_act2

holdout:
  seed: 0
  tier_ratios: [8, 1, 1]
  # Every Gwent card is VALIDATION-tier: the unseen game for evaluation
  held_out_games: [gwent]

regression_loss: huber

# Counts cards; the largest examples (two full decks) need ~120-200
hardware:
  max_batch_cost: 256
  precision: fp16

eval_examples_per_dojo: 128

phases:
  - name: train
    # per dojo, TRAIN count ** 0.3: big dojos get more steps, but
    # far fewer than in proportion (XLM-R's alpha)
    diet: {rule: temperature, alpha: 0.3}
    # "encoder" = the card model's trainable parameters (embedding
    # head and group attention); ModernBERT itself is frozen
    encoder_trainable: true
    encoder_lr: 1.0e-3
    head_lr: 1.0e-3
    # Equal budget for every cell: 20 rounds x 1000 steps = 20,000 steps
    steps_per_round: 1000
    max_rounds: 20
    # patience_rounds > max_rounds: no dojo ever saturates, so the diet
    # never changes and no cell ends early
    saturation:
      epsilon: 0.001
      patience_rounds: 1000
      reactivation_delta: 0.05
      target_saturated_fraction: 1.0
