holdout:
  seed: 0
  tier_ratios:
  - 8
  - 1
  - 1
  held_out_games:
  - gwent
regression_loss: huber
hardware:
  max_batch_cost: 256
  precision: fp16
  prefetch_depth: 2
eval_examples_per_dojo: 128
phases:
- name: train
  diet:
    rule: table
    table:
    - weight: 1
      table:
      - weight: 1
        dojos:
        - contrastive.*
      - weight: 1
        dojos:
        - contrastive_cross_slice.*
      - weight: 1
        dojos:
        - contrastive_slice_match.*
      - weight: 1
        dojos:
        - contrastive_missing_card.*
      - weight: 1
        dojos:
        - contrastive_odd_one_out.*
    - weight: 1
      dojos:
      - cardvault_fabtcg.*
      - dominiontabs.*
      - fabtcg_decklists.*
      - final_decks.*
      - hearthstonejson.*
      - isotropic.*
      - pokemon_tcg.*
      - scryfall.*
      - seventeenlands_draft_data.*
      - seventeenlands_game_data.*
      - seventeenlands_replay_data.*
      - spire_codex.*
      - sts2_runs.*
      - sts_gg.*
      within:
        rule: temperature
        alpha: 0.3
  encoder_trainable: true
  encoder_lr: 0.0001
  head_lr: 0.001
  steps_per_round: 1000
  max_rounds: 2
  saturation:
    epsilon: 0.001
    patience_rounds: 1000
    reactivation_delta: 0.05
    target_saturated_fraction: 1.0
warm_feature_cache:
- mtg
- pokemon
- hearthstone
- flesh_and_blood
- dominion
- slay_the_spire_2
- gwent
