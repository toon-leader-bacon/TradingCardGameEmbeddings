# Pooling pilot, arm tokwhite_mean: token whitening, then mean.
# All 8 arms (EXPERIMENTS_TODO.md, "Pooling and whitening") share this
# file except model.pooling / model.enrichment and run_directory. Base:
# the LR pilot's multi_mixed_lr1e-4, on a reduced diet (25 contrastive +
# 20 metric dojos instead of 149) so TEST passes are short and each
# contrastive dojo gets more steps.
# Run with (ROCm venv):
#   PYTHONPATH=. python scripts/run_training.py configs/training/Oct_10_2026_pooling_pilot/tokwhite_mean.yaml

run_directory: data/runs/Oct_10_2026_pooling_pilot/tokwhite_mean
device: cuda
seed: 0

model:
  embedding_head: residual_mlp
  checkpoint: answerdotai/ModernBERT-base
  card_embedding_size: 256
  mlp_hidden_dim: 512
  mlp_num_blocks: 3
  group_attention:
    num_layers: 2
    num_heads: 4
    ffn_dim: 1024
    dropout: 0.1
    norm_first: true
  pooling: {kind: mean}
  enrichment: {kind: whitening, stats_path: data/whitening/modernbert_tokens_holdout_seed0.pt}

dojos:
  - contrastive.*
  - contrastive_cross_slice.*
  - contrastive_slice_match.*
  - contrastive_missing_card.*
  - contrastive_odd_one_out.*
  - cardvault_fabtcg.card_type_mask
  - cardvault_fabtcg.cost_regression
  - dominiontabs.cost_regression
  - dominiontabs.type_mask
  - hearthstonejson.card_type_mask
  - hearthstonejson.cost_regression
  - pokemon_tcg.stage_mask
  - pokemon_tcg.types_mask
  - scryfall.card_type_mask
  - scryfall.colors_mask
  - spire_codex.cost_mask
  - spire_codex.rarity_mask
  - seventeenlands_game_data.win_rate_when_in_deck
  - seventeenlands_draft_data.card_take_rate
  - seventeenlands_replay_data.cast_rate
  - fabtcg_decklists.card_inclusion_rate
  - sts2_runs.card_upgrade_rate
  - sts_gg.card_floors_cleared
  - isotropic.opening_buy_rate
  - isotropic.average_copies_bought
  - "!*gwent*"

held_out_dojos:
  - cross_game.rarity_tier
  - cardvault_fabtcg.pitch_mask
  - fabtcg_decklists.hero_masked_from_deck
  - hearthstonejson.class_mask
  - isotropic.kingdom_veto_prediction
  - pokemon_tcg.hp_regression
  - scryfall.cmc_regression
  - seventeenlands_game_data.deck_win_prediction
  - seventeenlands_replay_data.average_turn_cast
  - spire_codex.card_type_mask
  - sts2_runs.card_reward_pick
  - sts2_runs.card_win_rate
  - sts2_runs.card_win_rate_at_act2

holdout:
  seed: 0
  tier_ratios: [8, 1, 1]
  held_out_games: [gwent]

regression_loss: huber

hardware:
  max_batch_cost: 256
  precision: fp16

eval_examples_per_dojo: 128

phases:
  - name: train
    # Half the steps to the contrastive dojos (each style equally, then
    # each game equally), half to the 20 metric dojos (TRAIN count ** 0.3)
    diet:
      rule: table
      table:
        - weight: 1
          table:
            - weight: 1
              dojos: ["contrastive.*"]
            - weight: 1
              dojos: ["contrastive_cross_slice.*"]
            - weight: 1
              dojos: ["contrastive_slice_match.*"]
            - weight: 1
              dojos: ["contrastive_missing_card.*"]
            - weight: 1
              dojos: ["contrastive_odd_one_out.*"]
        - weight: 1
          dojos:
          - cardvault_fabtcg.card_type_mask
          - cardvault_fabtcg.cost_regression
          - dominiontabs.cost_regression
          - dominiontabs.type_mask
          - hearthstonejson.card_type_mask
          - hearthstonejson.cost_regression
          - pokemon_tcg.stage_mask
          - pokemon_tcg.types_mask
          - scryfall.card_type_mask
          - scryfall.colors_mask
          - spire_codex.cost_mask
          - spire_codex.rarity_mask
          - seventeenlands_game_data.win_rate_when_in_deck
          - seventeenlands_draft_data.card_take_rate
          - seventeenlands_replay_data.cast_rate
          - fabtcg_decklists.card_inclusion_rate
          - sts2_runs.card_upgrade_rate
          - sts_gg.card_floors_cleared
          - isotropic.opening_buy_rate
          - isotropic.average_copies_bought
          within: {rule: temperature, alpha: 0.3}
    encoder_trainable: true
    encoder_lr: 1.0e-4
    head_lr: 1.0e-3
    steps_per_round: 1000
    max_rounds: 3
    saturation:
      epsilon: 0.001
      patience_rounds: 1000
      reactivation_delta: 0.05
      target_saturated_fraction: 1.0
